name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-and-publish:
    if: github.repository_owner == 'PIH'
    concurrency:
      group: build-and-deploy-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/build-and-deploy-to-openmrs-jfrog.yml@main
    with:
      image_name: partnersinhealth/pihmalawi-emr
      maven_profiles: distro-zip
      notify_ci_dashboard: true
    secrets: inherit

  e2e-tests:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    concurrency:
      group: e2e-tests-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  deploy-to-nenoci:
    if: github.repository_owner == 'PIH'
    needs: build-and-publish
    concurrency:
      group: deploy-to-nenoci-${{ github.ref }}
      cancel-in-progress: true
    uses: PIH/openmrs-contrib-distro-tools/.github/workflows/deploy-via-runner.yml@main
    with:
      runner-label: mw-his-neno-ci
      notify_ci_dashboard: true
    secrets: inherit
