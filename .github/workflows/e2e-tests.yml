name: E2E tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  e2e:
    if: github.repository_owner == 'PIH'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out pihmalawi-emr
        uses: actions/checkout@v4

      - name: Check out openmrs-contrib-distro-tools
        uses: actions/checkout@v4
        with:
          repository: PIH/openmrs-contrib-distro-tools
          path: .openmrs-contrib-distro-tools

      - name: Add distro-tools bin to PATH
        run: echo "${{ github.workspace }}/.openmrs-contrib-distro-tools/bin" >> "$GITHUB_PATH"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: pihci
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Note: this tests the currently-published partnersinhealth/pihmalawi-emr Docker Hub
      # image, not the checked-out branch/revision above — intentional for v1.
      # The OMRS_EXTRA_pihmalawi_warehouse_connection_* vars below need distro-tools'
      # PIH/openmrs-contrib-distro-tools#28 merged: create must capture them and openmrs.yaml's
      # env_file must pass them through. Until then `create` silently drops them (no existing
      # mechanism captures an arbitrary OMRS_EXTRA_* var), and art-report.spec.ts fails the same
      # way it did before this whole fix existed.
      - name: Create ephemeral instance
        env:
          OPENMRS_IMAGE_NAME: partnersinhealth/pihmalawi-emr
          SEED_IMAGE_NAME: partnersinhealth/pihmalawi-emr-seed-malawi
          SERVICES: openmrs-db,openmrs,petl
          PETL_IMAGE_NAME: partnersinhealth/apzu-etl
          PETL_FULL_REFRESH_JOBS: refresh-mysql-reporting.yml
          PETL_MYSQL_ROOT_PASSWORD: openmrs
          OMRS_EXTRA_pihmalawi_warehouse_connection_url: "jdbc:mysql://openmrs-db:3306/openmrs_warehouse?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8"
          OMRS_EXTRA_pihmalawi_warehouse_connection_username: openmrs
          OMRS_EXTRA_pihmalawi_warehouse_connection_password: openmrs
        run: openmrs-docker create e2e-malawi

      - name: Initialize from seed
        run: openmrs-docker e2e-malawi initialize

      - name: Start stack
        run: openmrs-docker e2e-malawi start

      - name: Wait for OpenMRS
        run: openmrs-docker e2e-malawi wait

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: e2e/.nvmrc

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080/openmrs
          E2E_USER_ADMIN_USERNAME: admin
          E2E_USER_ADMIN_PASSWORD: Admin123
          E2E_DOCKER_INSTANCE: e2e-malawi
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/playwright-report/
          retention-days: 1

      - name: Destroy instance
        if: always()
        run: openmrs-docker e2e-malawi destroy --force
